global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          environment: local
          service: prometheus

  - job_name: octabyte-api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - api:8000
        labels:
          environment: local
          service: octabyte-api
