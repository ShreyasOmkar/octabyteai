name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r dev-requirements.txt

      - name: Unit tests
        run: PYTHONPATH=. pytest -q

      - name: Build image
        run: docker build -t octabyte-app:ci .

      - name: Integration test
        run: |
          docker run \
            --detach \
            --name octabyte-api \
            --publish 127.0.0.1:8000:8000 \
            octabyte-app:ci

          for attempt in {1..15}; do
            if curl --fail http://127.0.0.1:8000/health; then
              exit 0
            fi

            echo "Health check attempt ${attempt}/15 failed"
            sleep 2
          done

          docker logs octabyte-api
          exit 1

      - name: Clean up integration container
        if: always()
        run: docker rm --force octabyte-api 2>/dev/null || true

    notify:
    name: Slack notification
    needs: test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL is unavailable."
            exit 0
          fi

          if [[ "$SLACK_WEBHOOK_URL" != https://hooks.slack.com/services/* ]]; then
            echo "::error::SLACK_WEBHOOK_URL has an invalid format."
            exit 1
          fi

          if [ "$TEST_RESULT" = "success" ]; then
            STATUS="✅ CI succeeded"
          else
            STATUS="❌ CI failed"
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          PAYLOAD=$(jq -n \
            --arg status "$STATUS" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg commit "${GITHUB_SHA:0:7}" \
            --arg actor "$GITHUB_ACTOR" \
            --arg run_url "$RUN_URL" \
            '{
              text: (
                $status + "\n" +
                "Repository: " + $repository + "\n" +
                "Branch: " + $branch + "\n" +
                "Commit: " + $commit + "\n" +
                "Triggered by: " + $actor + "\n" +
                "Run: " + $run_url
              )
            }')

          curl --fail-with-body \
            --retry 3 \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"
