name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: octabyteai

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Display expected OIDC identity
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Environment: build job has no GitHub environment"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-${{ github.run_id }}
          aws-region: ${{env.AWS_REGION}}
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: image
        name: Generate image URI
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          echo "uri=$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build container image
        run: docker build --tag "${{ steps.image.outputs.uri }}" .

      - name: Container scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.uri }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Push container image
        run: docker push "${{ steps.image.outputs.uri }}"

  staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Validate backend variables
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "::error::TF_STATE_BUCKET is not configured."
            exit 1
          fi

          if [[ "$TF_STATE_BUCKET" == s3://* ]] ||
            [[ "$TF_STATE_BUCKET" == /* ]] ||
            [[ "$TF_STATE_BUCKET" == */ ]]; then
            echo "::error::TF_STATE_BUCKET must contain only the bucket name."
            exit 1
          fi

          echo "Terraform state bucket: $TF_STATE_BUCKET"
          echo "AWS region: $AWS_REGION"

      - name: Terraform init
        run: |
          terraform -chdir=infra init \
            -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=octabyte/staging/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=terraform-locks" \
            -backend-config="encrypt=true"

      - name: Deploy to staging
        run: |
          terraform -chdir=infra apply \
            -auto-approve \
            -var-file=environments/staging/terraform.tfvars \
            -var="image_uri=${{ needs.build.outputs.image }}"

  production:
    needs: [build, staging]
    runs-on: ubuntu-latest

    # Configure required reviewers for this environment in GitHub.
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: |
          terraform -chdir=infra init \
            -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=octabyte/production/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=terraform-locks" \
            -backend-config="encrypt=true"

      - name: Deploy to production
        run: |
          terraform -chdir=infra apply \
            -auto-approve \
            -var-file=environments/production/terraform.tfvars \
            -var="image_uri=${{ needs.build.outputs.image }}"

  notify:
    name: Slack notification
    needs: build
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is unavailable; skipping notification."
            exit 0
          fi

          if [[ "$SLACK_WEBHOOK_URL" != https://hooks.slack.com/services/* ]]; then
            echo "::error::SLACK_WEBHOOK_URL has an invalid format."
            exit 1
          fi

          if [ "$BUILD_RESULT" = "success" ]; then
            STATUS="✅ Image successfully built, scanned, and pushed to ECR"
          else
            STATUS="❌ Image build, scan, or ECR push failed"
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          PAYLOAD=$(jq -n \
            --arg status "$STATUS" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg commit "$SHORT_SHA" \
            --arg build "$BUILD_RESULT" \
            --arg actor "$GITHUB_ACTOR" \
            --arg run_url "$RUN_URL" \
            '{
              text: (
                $status + "\n" +
                "Repository: " + $repository + "\n" +
                "Branch: " + $branch + "\n" +
                "Commit: " + $commit + "\n" +
                "Build: " + $build + "\n" +
                "Triggered by: " + $actor + "\n" +
                "Workflow: " + $run_url
              )
            }')

          curl --fail-with-body \
            --retry 3 \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"