  notify:
    name: Slack notification
    needs: [build]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BUILD_RESULT: ${{ needs.build.result }}
          STAGING_RESULT: ${{ needs.staging.result }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is unavailable; skipping notification."
            exit 0
          fi

          if [ "$PRODUCTION_RESULT" = "success" ]; then
            STATUS="✅ Production deployment succeeded"
          else
            STATUS="❌ Deployment pipeline did not complete successfully"
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          PAYLOAD=$(jq -n \
            --arg text "${STATUS}
          Repository: ${GITHUB_REPOSITORY}
          Branch: ${GITHUB_REF_NAME}
          Image tag: ${GITHUB_SHA}
          Build: ${BUILD_RESULT}
          Staging: ${STAGING_RESULT}
          Production: ${PRODUCTION_RESULT}
          Triggered by: ${GITHUB_ACTOR}
          Run: ${RUN_URL}" \
            '{text: $text}')

          curl --fail-with-body \
            --retry 3 \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"