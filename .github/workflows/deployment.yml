name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: octabyteai
  TF_STATE_BUCKET: octabyte-tfstate-824939474061

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Display expected OIDC identity
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Environment: build job has no GitHub environment"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{env.AWS_REGION}}
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: image
        name: Generate image URI
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          echo "uri=$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build container image
        run: docker build --tag "${{ steps.image.outputs.uri }}" .

      - name: Container scan
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"
        with:
          image-ref: ${{ steps.image.outputs.uri }}
          scan-type: image
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push container image
        run: docker push "${{ steps.image.outputs.uri }}"

  staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{env.AWS_REGION}}

      - uses: hashicorp/setup-terraform@v3

      - name: Validate backend variables
        run: |
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "::error::TF_STATE_BUCKET repository variable is not configured."
            exit 1
          fi

          if [[ "$TF_STATE_BUCKET" == s3://* ]] ||
            [[ "$TF_STATE_BUCKET" == /* ]] ||
            [[ "$TF_STATE_BUCKET" == */ ]]; then
            echo "::error::TF_STATE_BUCKET must contain only the bucket name."
            exit 1
          fi

          echo "Terraform state bucket: $TF_STATE_BUCKET"
          echo "AWS region: $AWS_REGION"

      - name: Terraform init
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${TF_STATE_BUCKET:-}" ]; then
            echo "::error::TF_STATE_BUCKET is empty."
            exit 1
          fi

          terraform -chdir=infra_code init \
            -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=octabyte/staging.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Deploy to staging
        run: |
          terraform -chdir=infra_code apply \
            -auto-approve \
            -var-file=environments/staging/staging.tfvars \
            -var="image_tag=${GITHUB_SHA}"

  production:
    needs: [build, staging]
    runs-on: ubuntu-latest

    # Configure required reviewers for this environment in GitHub.
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{env.AWS_REGION}}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: |
          terraform -chdir=infra_code init \
            -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=octabyte/production.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=terraform-locks" \
            -backend-config="encrypt=true"

      - name: Deploy to production
        run: |
          terraform -chdir=infra_code apply \
            -auto-approve \
            -var-file=environments/prod/prod.tfvars \
            -var="image_tag=${GITHUB_SHA}"

  notify:
    name: Slack notification
    needs: build
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is unavailable; skipping notification."
            exit 0
          fi

          if [[ "$SLACK_WEBHOOK_URL" != https://hooks.slack.com/services/* ]]; then
            echo "::error::SLACK_WEBHOOK_URL has an invalid format."
            exit 1
          fi

          if [ "$BUILD_RESULT" = "success" ]; then
            STATUS="✅ Image successfully built, scanned, and pushed to ECR"
          else
            STATUS="❌ Image build, scan, or ECR push failed"
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          PAYLOAD=$(jq -n \
            --arg status "$STATUS" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg commit "$SHORT_SHA" \
            --arg build "$BUILD_RESULT" \
            --arg actor "$GITHUB_ACTOR" \
            --arg run_url "$RUN_URL" \
            '{
              text: (
                $status + "\n" +
                "Repository: " + $repository + "\n" +
                "Branch: " + $branch + "\n" +
                "Commit: " + $commit + "\n" +
                "Build: " + $build + "\n" +
                "Triggered by: " + $actor + "\n" +
                "Workflow: " + $run_url
              )
            }')

          curl --fail-with-body \
            --retry 3 \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"